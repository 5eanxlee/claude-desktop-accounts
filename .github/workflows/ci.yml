name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer and session sync tests
        run: npm test
      - name: App build and self-tests
        run: ./app/build.sh
      - name: Installer syntax and package contents
        run: bash -n install.sh && npm pack --dry-run
