name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Session sync tests
        working-directory: sync
        run: npm test
      - name: App build and self-tests
        run: ./app/build.sh
      - name: Installer syntax
        run: bash -n install.sh && bash -n uninstall.sh
